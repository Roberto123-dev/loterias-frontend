<!DOCTYPE html>
<html lang="pt-BR" class="com-menu-lateral">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>📊 Resultado da Conferência</title>
  <!-- ✅ ADICIONAR ESTA LINHA: -->
  <script src="/js/config.js"></script>

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" />

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background: var(--fundo-pagina, #f3f4f6);
      min-height: 100vh;
      padding: 0;
      margin: 0
    }

    .container {
      width: 100%;
      padding: 15px;
      margin: 0;
    }

    /* Header */
    header {
      background: white;
      border-radius: 0;
      padding: 10px 20px;
      margin: 0;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
      width: 100%;
    }

    .header-content {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    h1 {
      font-size: 1rem;
      color: var(--cor-loteria, #667eea);
      margin: 0;
    }

    .btn-voltar {
      padding: 12px 24px;
      background: #667eea;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
      transition: opacity 0.3s;
    }

    .btn-voltar:hover {
      opacity: 0.9;
    }

    /* Jogo Consultado */
    .jogo-consultado {
      background: white;
      border-radius: 5px;
      padding: 20px;
      margin-bottom: 15px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
    }

    .jogo-consultado h1 {
      font-size: 1rem;
      color: #333;
      margin-bottom: 10px;
    }

    .jogo-consultado-info {
      color: #666;
      margin-bottom: 15px;
      font-size: 1rem;
    }

    .numeros-jogo {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .bola-jogo {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: var(--cor-loteria, #667eea);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 1.1rem;
    }

    /* Resumo */
    .resumo-container {
      background: white;
      border-radius: 5px;
      padding: 15px;
      margin-bottom: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
    }

    .resumo-container h1 {
      font-size: 1rem;
      color: #333;
      margin-bottom: 20px;
    }

    .resumo-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      gap: 2px;
      margin-bottom: 20px;
    }

    .resumo-item {
      /* texto sobre a cor da loteria: tokens de contraste de /js/loterias.js */
      background: var(--cor-loteria-fundo, var(--cor-loteria, #667eea));
      color: var(--cor-loteria-texto, white);
      padding: 2px;
      text-align: center;
    }

    .resumo-qtd {
      background: #ffffff;
      color: #333;
      font-size: 1rem;
      padding: 1px 0;
    }

    .resumo-label {
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 6px;
      opacity: 0.95;
    }

    /* Detalhes */
    .detalhes-container {
      background: white;
      border-radius: 5px;
      padding: 15px;
      margin-bottom: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
    }

    .detalhes-container h2 {
      font-size: 1.5rem;
      color: #333;
      margin-bottom: 20px;
    }

    .concurso-card {
      background: #f8f9fa;
      border-radius: 10px;
      padding: 20px;
      margin-bottom: 15px;
      border-left: 5px solid var(--cor-loteria, #667eea);
    }

    .concurso-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
      flex-wrap: wrap;
      gap: 10px;
    }

    .concurso-numero {
      font-size: 1.2rem;
      font-weight: bold;
      color: var(--cor-loteria, #667eea);
    }

    .concurso-data {
      color: #666;
      font-size: 0.95rem;
    }

    .acertos-badge {
      display: inline-block;
      padding: 8px 20px;
      border-radius: 20px;
      font-weight: bold;
      font-size: 1rem;
      background: #4caf50;
      color: white;
    }

    .numeros-sorteados {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .bola-sorteada {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: #e0e0e0;
      color: #666;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 0.9rem;
    }

    .bola-sorteada.acertou {
      background: #4caf50;
      color: white;
      box-shadow: 0 3px 10px rgba(76, 175, 80, 0.4);
    }

    .loading {
      text-align: center;
      padding: 60px 20px;
      color: #374151;
      font-size: 1.5rem;
    }

    .loading::after {
      content: "...";
      animation: dots 1.5s steps(4, end) infinite;
    }

    @keyframes dots {

      0%,
      20% {
        content: ".";
      }

      40% {
        content: "..";
      }

      60%,
      100% {
        content: "...";
      }
    }

    .erro-container {
      background: white;
      border-radius: 15px;
      padding: 40px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
    }

    .erro-container h2 {
      color: #f44336;
      margin-bottom: 15px;
    }

    /* Faixa de prêmio, sorteios (Dupla Sena) e extras (trevos, time, mês) */
    .faixa-badge {
      display: inline-block;
      padding: 6px 14px;
      border-radius: 20px;
      font-weight: 700;
      font-size: 0.9rem;
      background: #fef3c7;
      color: #92400e;
    }

    .sorteio-bloco + .sorteio-bloco {
      margin-top: 14px;
      padding-top: 14px;
      border-top: 1px dashed #d1d5db;
    }

    .sorteio-titulo {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 8px;
      font-weight: 700;
      color: #374151;
    }

    .sorteio-titulo .acertos-sorteio {
      font-weight: 600;
      color: #4b5563;
    }

    .extra-linha {
      margin-top: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      color: #374151;
      font-weight: 600;
    }

    .bola-sorteada.trevo {
      border-radius: 10px;
      width: auto;
      padding: 0 10px;
    }

    .extra-acertou {
      color: #166534;
    }

    .resumo-item.premiado {
      outline: 3px solid #f59e0b;
    }

    .resumo-faixa {
      font-size: 0.8rem;
      font-weight: 700;
      margin-bottom: 4px;
    }

    /* Responsivo */
    @media (max-width: 768px) {
      h1 {
        font-size: 1.5rem;
      }

      .jogo-consultado,
      .resumo-container,
      .detalhes-container {
        padding: 15px;
      }

      .bola-jogo {
        width: 40px;
        height: 40px;
        font-size: 0.95rem;
      }

      .bola-sorteada {
        width: 32px;
        height: 32px;
        font-size: 0.8rem;
      }

      .resumo-grid {
        grid-template-columns: repeat(4, 1fr);
      }

      .concurso-card {
        padding: 15px;
      }
    }
  </style>
    <!-- Menu lateral compartilhado + tema da loteria ativa -->
    <script src="/js/loterias.js"></script>
    <link rel="stylesheet" href="/css/tema-loteria.css" />
    <link rel="stylesheet" href="/css/menu-lateral.css" />
</head>

<body>
    <aside class="sidebar" id="sidebar">
        <script src="/js/menu-lateral.js"></script>
    </aside>

  <!-- Header -->
  <header>
    <div class="header-content">
      <h1 id="titulo-loteria">Resultado da Conferência</h1>
      <a href="#" class="btn-voltar" id="btn-voltar-dinamico">
        ← Voltar
      </a>
    </div>
  </header>

  <div class="container">

    <!-- Loading -->
    <div id="loading" class="loading">Processando resultado</div>

    <!-- Erro -->
    <div id="erro-container" class="erro-container" style="display: none">
      <h2>❌ Erro ao Carregar</h2>
      <p>Não foi possível carregar o resultado da conferência.</p>
      <br />
      <a href="#" class="btn-voltar" id="btn-voltar-dinamico">
        ← Voltar
      </a>
    </div>

    <!-- Jogo Consultado -->
    <div id="jogo-consultado" class="jogo-consultado" style="display: none">
      <h1>Jogo Consultado</h1>
      <p class="jogo-consultado-info">
        Seu Jogo (<span id="qtd-dezenas">0</span> dezenas):
      </p>
      <div class="numeros-jogo" id="numeros-jogo"></div>
    </div>

    <!-- Resumo -->
    <div id="resumo-container" class="resumo-container" style="display: none">
      <h1>📊 Resumo por faixa</h1>
      <div class="resumo-grid" id="resumo-grid"></div>
    </div>

    <!-- Detalhes -->
    <div id="detalhes-container" class="detalhes-container" style="display: none">
      <h2>🎯 Detalhes dos Acertos</h2>
      <div id="concursos-list"></div>
    </div>
  </div>

  <script src="/js/escape-html.js"></script>
  <script>
    // ✅ Pegar token
    function getToken() {
      return localStorage.getItem("token");
    }

    // ✅ Criar headers
    function getHeaders() {
      const token = getToken();
      return {
        Authorization: `Bearer ${token}`,
        "Content-Type": "application/json",
      };
    }

    // ✅ Verificar autenticação
    function verificarAutenticacao() {
      const token = getToken();
      if (!token) {
        alert("Você precisa fazer login!");
        window.location.href = "/auth/login.html";
        return false;
      }
      return true;
    }

    async function carregarResultado() {
      // ✅ Verificar autenticação
      if (!verificarAutenticacao()) return;
      try {
        // Pegar dados do localStorage
        const dadosJogo = localStorage.getItem("conferencia_jogo");

        if (!dadosJogo) {
          alert("Nenhum jogo selecionado.");
          window.location.href = "/jogos/meus-jogos.html";
          return;
        }

        // ✅ PRIMEIRO parseia
        const jogo = JSON.parse(dadosJogo);

        // 🔥 AGORA pode usar jogo.origem
        const btnVoltar = document.getElementById("btn-voltar-dinamico");

        if (jogo.origem === "meus-jogos") {
          btnVoltar.innerHTML = `
    <i class="bi bi-arrow-left"></i>
  `;
          btnVoltar.href = "/jogos/meus-jogos.html";
        } else {
          btnVoltar.innerHTML = `
    <i class="bi bi-arrow-left"></i> Nova Consulta
  `;
          btnVoltar.href = "/analise/conferir.html";
        }


        // 🔥 MUITO IMPORTANTE: remover para não reutilizar
        localStorage.removeItem("conferencia_jogo");

        // Aplicar cor da loteria
        document.documentElement.style.setProperty("--cor-loteria", jogo.cor);
        document.getElementById(
          "titulo-loteria"
        ).textContent = `Resultado - ${jogo.nomeLoteria}`;

        // ✅ Buscar o histórico completo da API COM TOKEN (paginado)
        const concursos = await buscarHistoricoCompleto(jogo.endpoint);

        // Processar resultados (regras oficiais em /js/loterias.js)
        const slug = Loterias.normalizarSlug(jogo.loteria || String(jogo.endpoint || "").replace(/^\//, ""));
        if (slug) Loterias.aplicarTema(slug); // cores da loteria conferida (com contraste)
        const resultados = conferirAcertos(slug, jogo, concursos);

        // Mostrar resultado
        mostrarResultado(jogo, resultados);
      } catch (error) {
          if (error && error.limiteAtingido) return; // aviso de limite já mostrado (js/config.js)
        console.error("Erro:", error);
        document.getElementById("loading").style.display = "none";
        document.getElementById("erro-container").style.display = "block";
      }
    }

    // A API devolve no máximo 500 concursos por página (backend: utils/paginacao.js).
    // A 1ª página traz o total; as demais são buscadas em paralelo.
    const POR_PAGINA = 500;

    async function buscarPaginaConcursos(endpoint, offset) {
      const response = await fetch(
        `${API_URL}${endpoint}?limit=${POR_PAGINA}&offset=${offset}`,
        {
          headers: getHeaders(),
        }
      );

      // ✅ Verificar se a resposta é OK
      if (!response.ok) {
        if (response.status === 401) {
          throw new Error("Sessão expirada. Faça login novamente.");
        } else if (response.status === 403) {
          throw new Error("Você não tem permissão para acessar este recurso.");
        }
        throw new Error(`Erro ${response.status}: ${response.statusText}`);
      }
      const data = await response.json();

      if (!data.success) {
        throw new Error(data.message || "Erro ao buscar concursos");
      }
      return data;
    }

    async function buscarHistoricoCompleto(endpoint) {
      const primeira = await buscarPaginaConcursos(endpoint, 0);
      const total = Number(primeira.total) || primeira.data.length;

      const offsets = [];
      for (let offset = POR_PAGINA; offset < total; offset += POR_PAGINA) {
        offsets.push(offset);
      }
      const demais = await Promise.all(
        offsets.map((offset) => buscarPaginaConcursos(endpoint, offset))
      );

      return primeira.data.concat(...demais.map((pagina) => pagina.data));
    }

    // Confere o jogo em cada concurso. Dupla Sena: cada sorteio é um evento
    // (as dezenas do 1º e do 2º sorteio nunca se somam).
    function conferirAcertos(slug, jogo, concursos) {
      const meuJogo = {
        dezenas: (jogo.numeros || []).map(Number),
        trevos: jogo.trevos || [],
        time_coracao: jogo.time_coracao || null,
        mes_sorte: jogo.mes_sorte || null,
      };
      const resultados = [];

      concursos.forEach((concurso) => {
        const c = Loterias.conferir(slug, meuJogo, concurso);
        if (c.acertos > 0 || c.premiado) {
          resultados.push({ concurso, slug, ...c });
        }
      });

      // Premiados primeiro, depois mais acertos, depois o concurso mais recente
      resultados.sort(
        (a, b) =>
          Number(b.premiado) - Number(a.premiado) ||
          b.acertos - a.acertos ||
          b.concurso.concurso - a.concurso.concurso,
      );
      return resultados;
    }

    // Chave do resumo para um sorteio: a faixa oficial (se premia) ou "N acertos"
    function chaveResumo(slug, sorteio) {
      const n = sorteio.acertos;
      return sorteio.faixa || `${n} acerto${n === 1 ? "" : "s"}`;
    }

    const LIMITE_RESULTADOS_EXIBIDOS = 10;

    function mostrarResultado(jogo, resultados) {
      document.getElementById("loading").style.display = "none";

      // Jogo Consultado
      document.getElementById("qtd-dezenas").textContent =
        jogo.numeros.length;
      const numerosDiv = document.getElementById("numeros-jogo");
      numerosDiv.innerHTML = "";

      jogo.numeros
        .sort((a, b) => a - b)
        .forEach((num) => {
          const bola = document.createElement("div");
          bola.className = "bola-jogo";
          const texto =
            jogo.min === 0 ? num.toString().padStart(2, "0") : num;
          bola.textContent = texto;
          numerosDiv.appendChild(bola);
        });

      document.getElementById("jogo-consultado").style.display = "block";

      // Resumo por faixa (Dupla Sena: cada sorteio conta como um evento)
      const resumo = new Map(); // chave → { qtd, premiado, ordem }
      const somar = (chave, premiado, ordem) => {
        const item = resumo.get(chave) || { qtd: 0, premiado, ordem };
        item.qtd++;
        resumo.set(chave, item);
      };
      resultados.forEach((r) => {
        r.porSorteio.forEach((s) => {
          if (s.acertos > 0 || s.faixa) somar(chaveResumo(r.slug, s), Boolean(s.faixa), s.acertos * 10 + r.trevosAcertados);
        });
        if (r.acertouTime) somar("Time do Coração", true, -1);
        if (r.acertouMes) somar("Mês da Sorte", true, -1);
      });

      const resumoDiv = document.getElementById("resumo-grid");
      resumoDiv.innerHTML = "";

      // Faixas premiadas primeiro, do maior acerto para o menor
      [...resumo.entries()]
        .sort((a, b) => Number(b[1].premiado) - Number(a[1].premiado) || b[1].ordem - a[1].ordem)
        .forEach(([chave, item]) => {
          const div = document.createElement("div");
          div.className = `resumo-item${item.premiado ? " premiado" : ""}`;
          div.innerHTML = `
            <div class="resumo-label">${escapeHtml(chave)}</div>
            ${item.premiado ? '<div class="resumo-faixa">🏆 faixa premiada</div>' : ""}
            <div class="resumo-qtd">${item.qtd}</div>
          `;
          resumoDiv.appendChild(div);
        });

      document.getElementById("resumo-container").style.display = "block";

      // Detalhes (primeiros 50)
      const concursosList = document.getElementById("concursos-list");
      concursosList.innerHTML = "";

      resultados.slice(0, LIMITE_RESULTADOS_EXIBIDOS).forEach((resultado) => {
        const card = document.createElement("div");
        card.className = "concurso-card";

        const fmt = (num) => (jogo.min === 0 ? String(num).padStart(2, "0") : num);
        const bolas = (dezenas, acertadas) =>
          dezenas
            .map((num) => `<div class="bola-sorteada ${acertadas.includes(num) ? "acertou" : ""}">${fmt(num)}</div>`)
            .join("");
        const plural = (n) => `${n} acerto${n === 1 ? "" : "s"}`;
        const sorteios = Loterias.sorteiosDoConcurso(resultado.slug, resultado.concurso);
        const variosSorteios = sorteios.length > 1;

        // Um bloco por sorteio; na Dupla Sena cada sorteio tem a sua faixa
        const sorteiosHTML = resultado.porSorteio
          .map((s, i) => `
            <div class="sorteio-bloco">
              ${variosSorteios ? `
              <div class="sorteio-titulo">
                <span>${s.rotulo}</span>
                <span class="acertos-sorteio">${plural(s.acertos)}</span>
                ${s.faixa ? `<span class="faixa-badge">🏆 ${escapeHtml(s.faixa)}</span>` : ""}
              </div>` : ""}
              <div class="numeros-sorteados">${bolas(sorteios[i].dezenas, s.acertadas)}</div>
            </div>`)
          .join("");

        // Extras: trevos (+Milionária), time do coração (Timemania), mês da sorte (Dia de Sorte)
        let extrasHTML = "";
        const c = resultado.concurso;
        if (resultado.slug === "maismilionaria" && Array.isArray(c.trevos)) {
          const meus = (jogo.trevos || []).map(Number);
          extrasHTML += `
            <div class="extra-linha">Trevos:
              ${c.trevos.map((t) => `<div class="bola-sorteada trevo ${meus.includes(Number(t)) ? "acertou" : ""}">🍀 ${t}</div>`).join("")}
              <span>(${resultado.trevosAcertados} acertado${resultado.trevosAcertados === 1 ? "" : "s"})</span>
            </div>`;
        }
        if (resultado.slug === "timemania" && c.time_coracao) {
          extrasHTML += `<div class="extra-linha ${resultado.acertouTime ? "extra-acertou" : ""}">Time do Coração: ${escapeHtml(c.time_coracao)}${resultado.acertouTime ? " — 🏆 acertou" : ""}</div>`;
        }
        if (resultado.slug === "diadasorte" && c.mes_sorte) {
          extrasHTML += `<div class="extra-linha ${resultado.acertouMes ? "extra-acertou" : ""}">Mês da Sorte: ${escapeHtml(Loterias.normalizarMes(c.mes_sorte) || c.mes_sorte)}${resultado.acertouMes ? " — 🏆 acertou" : ""}</div>`;
        }

        // Badge do topo: faixa (loteria de um sorteio) ou o maior acerto (Dupla Sena)
        const faixaUnica = !variosSorteios && resultado.porSorteio[0].faixa;
        const badgeTopo = faixaUnica
          ? `<div class="faixa-badge">🏆 ${escapeHtml(faixaUnica)}</div>`
          : `<div class="acertos-badge">${variosSorteios ? "Melhor sorteio: " : ""}${plural(resultado.acertos)}</div>`;

        card.innerHTML = `
                    <div class="concurso-header">
                        <div>
                            <div class="concurso-numero">Concurso #${c.concurso}</div>
                        </div>
                        ${badgeTopo}
                    </div>
                    ${sorteiosHTML}
                    ${extrasHTML}
                `;

        concursosList.appendChild(card);
      });

      if (resultados.length > LIMITE_RESULTADOS_EXIBIDOS) {
        const aviso = document.createElement("div");
        aviso.style.textAlign = "center";
        aviso.style.padding = "20px";
        aviso.style.color = "#666";
        aviso.textContent = `Mostrando os primeiros ${LIMITE_RESULTADOS_EXIBIDOS} resultados. Total de concursos com acertos: ${resultados.length}`;
        concursosList.appendChild(aviso);
      }

      document.getElementById("detalhes-container").style.display = "block";
    }

    // ✅ Carregar ao iniciar (após verificar auth)
    carregarResultado();
  </script>
  <script src="/js/auth-check.js"></script>
  <script>
    // Autenticação básica
    verificarAutenticacao();
  </script>
</body>

</html>
