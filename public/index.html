                    var p = localStorage.getItem("plano");
                    if (p) return p.toLowerCase();
                    var u = JSON.parse(

                    );
                    if (u && u.plano) return String(u.plano).toLowerCase();

        <script>
            let planoUsuario = window.getPlanoCache();
            let modalUpgrade;

            function getUsuario() {
                try {
                    return JSON.parse(localStorage.getItem("usuario"));
                } catch {
                    return null;
                }
            }

            // ========== PLANO ==========
            function parseJwt(token) {
                try {
                    const base64Url = token.split(".")[1];
                    const base64 = base64Url
                        .replace(/-/g, "+")
                        .replace(/_/g, "/");
                    const jsonPayload = decodeURIComponent(
                        window
                            .atob(base64)
                            .split("")
                            .map(
                                (c) =>
                                    "%" +
                                    ("00" + c.charCodeAt(0).toString(16)).slice(
                                        -2,
                                    ),
                            )
                            .join(""),
                    );
                    return JSON.parse(jsonPayload);
                } catch (e) {
                    return null;
                }
            }

            async function verificarPlanoUsuario() {
                const token = localStorage.getItem("token");
                if (!token) {
                    planoUsuario = "free";
                    atualizarBadgePlano("free");
                    atualizarMenuBadges("free");
                    return { plano: "free" };
                }
                try {
                    const response = await fetch(
                        `${API_URL}/api/planos/meu-plano`,
                        {
                            headers: { Authorization: `Bearer ${token}` },
                        },
                    );
                    if (!response.ok)
                        throw new Error(`HTTP ${response.status}`);

                    const data = await response.json();
                    if (data?.success && data.data?.plano) {
                        planoUsuario = data.data.plano;
                        localStorage.setItem("plano", planoUsuario);
                        atualizarBadgePlano(planoUsuario);
                        atualizarMenuBadges(planoUsuario);
                        return data.data;
                    }
                } catch (error) {
                    console.error("Erro ao verificar plano:", error);
                }
                return { plano: "free" };
            }

            function atualizarBadgePlano(plano) {
                const badge = document.getElementById("badge-plano");
                if (plano === "pro") {
                    badge.textContent = "⭐ PRÓ";
                    badge.className = "badge-plano badge-pro";
                } else {
                    badge.textContent = "FREE";
                    badge.className = "badge-plano badge-free";
                }
            }

            function atualizarMenuBadges(plano) {
                const badges = document.querySelectorAll(".menu-badge");
                const isPro = plano === "pro";
                document.documentElement.classList.toggle("plano-pro", isPro);
                badges.forEach((badge) => {
                    badge.style.display = isPro ? "none" : "";
                });
            }

            function mostrarModalUpgrade() {
                if (modalUpgrade) modalUpgrade.show();
            }

            function fazerUpgrade() {
                const usuario = getUsuario();

                if (!usuario) {
                    alert(
                        "❌ Erro: Usuário não encontrado. Faça login novamente.",
                    );
                    return;
                }

                const body = document.getElementById("modalUpgradeBody");

                body.innerHTML = `
          <div class="text-center">
            <div style="font-size:3.5rem">💎</div>
            <h2 class="mt-2 fw-bold">Seja PRÓ</h2>
            <p class="text-muted">
              Libere <strong>todas as funcionalidades</strong> do Sistema de Loterias
            </p>
          </div>

          <!-- PLANO DESTAQUE -->
          <div class="card border-0 shadow-sm mt-4"
              style="background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;">
            <div class="card-body text-center">
              <span class="badge bg-warning text-dark mb-2">🔥 MELHOR OFERTA</span>
              <h3 class="fw-bold mt-2">Plano Anual PRÓ</h3>

              <div style="font-size:3rem;font-weight:bold">
                R$ 29,90
              </div>
              <small>pagamento único • acesso por 12 meses</small>

              <ul class="list-unstyled mt-3 text-start">
                <li>✅ Gerador ilimitado de jogos</li>
                <li>✅ Salvar e organizar jogos</li>
                <li>✅ Conferência automática</li>
                <li>✅ Estatísticas e mapas</li>
                <li>✅ Atualizações em tempo real</li>
              </ul>
            </div>
          </div>

          <!-- COMO FUNCIONA -->
          <div class="mt-4 text-muted text-start">
            <p class="fw-bold mb-1">🔐 Como funciona</p>
            <small>
              1️⃣ Realize o pagamento do plano<br>
              2️⃣ Envie o comprovante<br>
              3️⃣ Ativação em até <strong>24 horas</strong>
            </small>
          </div>

          <!-- PIX -->
          <div class="mt-4">
            <p class="fw-bold mb-2">💠 Pagamento via PIX</p>

            <div class="d-flex justify-content-center gap-2">
              <input
                type="text"
                id="pixKey"
                class="form-control text-center"
                style="max-width:260px"
                value="21981092008"
                readonly
              />

              <button class="btn btn-success" onclick="copiarPix()">
                📋 Copiar
              </button>
            </div>

            <small class="text-muted d-block mt-2">
              Chave PIX • Celular
            </small>
          </div>

            <!-- WHATSAPP -->
            <div class="mt-4 text-center">
              <a
                href="https://wa.me/5521981092008"
                target="_blank"
                class="btn btn-success btn-lg w-100 d-flex align-items-center justify-content-center gap-2"
                style="border-radius: 12px;"
              >
                <i class="bi bi-whatsapp" style="font-size: 1.5rem;"></i>
                Falar no WhatsApp
              </a>

              <small class="text-muted d-block mt-2">
                Atendimento rápido após o pagamento
              </small>
            </div>

            <button class="btn btn-outline-secondary"
                    data-bs-dismiss="modal">
              Agora não
            </button>
          </div>
        `;
            }

            function copiarPix() {
                const pixInput = document.getElementById("pixKey");
                pixInput.select();
                pixInput.setSelectionRange(0, 99999); // mobile

                navigator.clipboard.writeText(pixInput.value);

                alert(
                    "✅ Chave PIX copiada!\n\nAgora cole no app do seu banco para realizar o pagamento.",
                );
            }

            function verDetalhes(loteriaId) {
                if (planoUsuario === "free") {
                    mostrarModalUpgrade();
                    return false;
                }
                window.location.href = `/loterias/${loteriaId}.html`;
            }

            function logout() {
                // preserva a última loteria escolhida
                const loteriaAtiva = localStorage.getItem("loteriaAtiva");
                localStorage.clear();
                if (loteriaAtiva) localStorage.setItem("loteriaAtiva", loteriaAtiva);
                location.href = "/auth/login.html";
            }

            // ========== LOTERIA ATIVA (destaque + atalhos) ==========
            let ultimosResultados = null; // { slug: resultado } de /api/resultados/ultimos-todos
            let erroResultados = false;

            function bolasHTML(dezenas, classe = "") {
                return (dezenas || [])
                    .map((d) => `<span class="bola ${classe}">${Loterias.formatarDezena(d)}</span>`)
                    .join("");
            }

            function sorteiosHTML(loteria, resultado) {
                if (loteria.sorteios === 2) {
                    return `
                <div><div class="rotulo-sorteio">1º sorteio</div><div class="bolas">${bolasHTML(resultado.dezenas)}</div></div>
                <div><div class="rotulo-sorteio">2º sorteio</div><div class="bolas">${bolasHTML(resultado.dezenas_2)}</div></div>`;
                }
                let html = `<div class="bolas">${bolasHTML(resultado.dezenas)}</div>`;
                const extra = loteria.extra;
                if (extra && extra.tipo === "trevos" && (resultado.trevos || []).length) {
                    html += `<div><div class="rotulo-sorteio">${extra.rotulo}</div><div class="bolas">${bolasHTML(resultado.trevos, "trevo")}</div></div>`;
                } else if (extra && resultado[extra.campo]) {
                    // texto vindo da Caixa: escapar
                    html += `<div class="extra-concurso">${extra.rotulo}: ${escapeHtml(resultado[extra.campo])}</div>`;
                }
                return html;
            }

            function renderizarDestaque(loteria) {
                const el = document.getElementById("loteria-destaque");
                const resultado = ultimosResultados ? ultimosResultados[loteria.slug] : null;

                const cabecalho = `
            <div class="cabecalho-loteria">
                <img src="${loteria.icone}" alt="" width="52" height="52" />
                <div>
                    <h1>${loteria.nome}</h1>
                    <div class="subtitulo">Último resultado</div>
                </div>
            </div>`;

                if (!resultado) {
                    const msg = erroResultados || ultimosResultados
                        ? "❌ Resultado indisponível no momento"
                        : "Carregando resultado...";
                    el.innerHTML = `${cabecalho}<div class="destaque-corpo"><p class="text-muted m-0">${msg}</p></div>`;
                    return;
                }

                const status = Loterias.statusConcurso(resultado);
                const statusClasse = {
                    acumulou: "status-acumulou",
                    ganhadores: "status-ganhador",
                    aguardando: "status-aguardando",
                }[status.tipo];
                const dataSorteio = Loterias.formatarData(resultado.data_sorteio); // NULL → não exibe
                const proximo = Loterias.proximoSorteio(loteria.slug, resultado.data_proximo_concurso);
                const proximoTexto = proximo
                    ? proximo.ehHoje || proximo.ehAmanha
                        ? `${proximo.texto}, ${proximo.dataTexto}`
                        : proximo.texto
                    : "—";

                el.innerHTML = `${cabecalho}
            <div class="destaque-corpo">
                <div class="destaque-topo">
                    <div class="destaque-concurso">
                        Concurso ${resultado.concurso}${dataSorteio ? ` <span class="destaque-data">· ${dataSorteio}</span>` : ""}
                    </div>
                    <span class="status-concurso ${statusClasse}">${status.texto}</span>
                </div>
                ${sorteiosHTML(loteria, resultado)}
                <div class="premio-bloco">
                    <div>
                        <div class="premio-rotulo">Prêmio estimado do próximo concurso</div>
                        <div class="premio-valor">${Loterias.formatarPremio(resultado.valor_estimado_proximo)}</div>
                    </div>
                    <div>
                        <div class="premio-rotulo">Próximo sorteio · Concurso ${Number(resultado.concurso) + 1}</div>
                        <div class="proximo-valor ${proximo && proximo.ehHoje ? "proximo-hoje" : ""}">
                            ${proximo && proximo.ehHoje ? '<i class="bi bi-clock-fill"></i> ' : ""}${proximoTexto}
                        </div>
                    </div>
                </div>
                <div class="destaque-rodape">
                    <a class="btn-ver-mais" href="${Loterias.urlUltimosResultados(loteria.slug)}">
                        Últimos resultados
                    </a>
                </div>
            </div>`;
            }

            function renderizarAtalhos(loteria) {
                document.getElementById("titulo-atalhos").textContent =
                    `Ferramentas da ${loteria.nome}`;
                document.getElementById("atalhos-grid").innerHTML = Loterias.FERRAMENTAS
                    .filter((f) => f.id !== "inicio")
                    .map((f) => {
                        if (!Loterias.suporta(loteria.slug, f.id)) {
                            return `
                <span class="atalho em-breve" aria-disabled="true" title="Em breve para esta loteria">
                    <i class="bi ${f.icone}"></i>${f.nome}<small>Em breve para esta loteria</small>
                </span>`;
                        }
                        return `
                <a class="atalho" href="${Loterias.urlFerramenta(f.id, loteria.slug)}">
                    <i class="bi ${f.icone}"></i>${f.nome}
                </a>`;
                    })
                    .join("");
            }

            function renderizarLoteriaAtiva() {
                const loteria = Loterias.obter(Loterias.ativa());
                document.title = `${loteria.nome} — Roberto Loterias`;
                renderizarDestaque(loteria);
                renderizarAtalhos(loteria);
            }

            // Troca pelo seletor do menu: atualiza sem recarregar
            document.addEventListener("loteria-ativa-mudou", renderizarLoteriaAtiva);

            // Atalho "Em breve" não navega
            document.getElementById("atalhos-grid").addEventListener("click", (event) => {
                const atalho = event.target.closest(".atalho");
                if (!atalho) return;
                if (atalho.classList.contains("em-breve")) {
                    event.preventDefault();
                }
            });

            // ========== CARREGAR RESULTADOS (OTIMIZADO) ==========
            let isLoadingResultados = false;

            async function carregarResultados() {
                if (isLoadingResultados) return; // trava a corrida com o setInterval
                isLoadingResultados = true;

                try {
                    const response = await fetch(
                        `${API_URL}/api/resultados/ultimos-todos`,
                    );
                    if (!response.ok)
                        throw new Error(`HTTP ${response.status}`);

                    const data = await response.json();
                    if (!data || !data.success || !data.data) {
                        throw new Error("Resposta inválida do servidor");
                    }

                    console.log(`📦 Cache: ${data.cached ? "SIM ⚡" : "NÃO"}`);

                    const resultados = data.data;
                    ultimosResultados = resultados;
                    erroResultados = false;
                    renderizarLoteriaAtiva();
                } catch (error) {
                    console.error("❌ Erro ao carregar resultados:", error);
                    erroResultados = true;
                    // não apaga um resultado bom já na tela
                    if (!ultimosResultados) renderizarLoteriaAtiva();
                } finally {
                    isLoadingResultados = false;
                }
            }

            // ========== INICIALIZAÇÃO ==========
            window.addEventListener("DOMContentLoaded", async () => {
                try {
                    const modalEl = document.getElementById("modalUpgrade");
                    if (window.bootstrap?.Modal && modalEl) {
                        modalUpgrade = new bootstrap.Modal(modalEl);
                    }
                } catch (e) {
                    console.error("Falha ao iniciar o modal:", e);
                }

                renderizarLoteriaAtiva(); // cabeçalho já aparece enquanto carrega

                const user = getUsuario();
                if (user) {
                    const nomeEl = document.getElementById("nome-usuario");
                    if (nomeEl) nomeEl.textContent = `👤 ${user.nome}`;
                }

                const token = localStorage.getItem("token");
                if (token) {
                    const payload = parseJwt(token);
                    if (payload && payload.role === "admin") {
                        const adminEl = document.getElementById("btn-admin");
                        if (adminEl) adminEl.style.display = "inline-block";
                    }
                }

                const urlParams = new URLSearchParams(window.location.search);
                if (urlParams.get("upgrade") === "1") {
                    setTimeout(() => mostrarModalUpgrade(), 400);
                }

                // notificações: js/menu-lateral.js
                await verificarPlanoUsuario();

                carregarResultados();
                setInterval(carregarResultados, 5 * 60 * 1000);
            });
        </script>
        <script src="/js/auth-check.js"></script>
    </body>
</html>
